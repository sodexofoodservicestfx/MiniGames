<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>STFX Mini Games</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

/* ========================= */
/* GENERAL */
/* ========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}


/* ========================= */
/* BODY */
/* ========================= */

body{

    min-height:100vh;

    background:
    linear-gradient(
        135deg,
        #003A70,
        #0057B8,
        #00A6D6
    );

    display:flex;

    justify-content:center;

    align-items:center;

    padding:30px;

}


/* ========================= */
/* MAIN ARCADE AREA */
/* ========================= */

.arcade{

    width:100%;

    max-width:1000px;

    min-height:650px;

    background:#F7F9FC;

    border-radius:35px;

    padding:35px 45px 45px;

    box-shadow:
    0 25px 60px rgba(0,0,0,.3);

}


/* ========================= */
/* HEADER */
/* ========================= */

.header{

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:35px;

}


.title-area h1{

    font-size:42px;

    font-weight:800;

    color:#003A70;

}


.title-area p{

    color:#666;

    font-size:18px;

    margin-top:5px;

}


.logo{

    height:65px;

    width:auto;

}


/* ========================= */
/* GAME GRID */
/* ========================= */

.game-grid{

    display:grid;

    grid-template-columns:
    repeat(2,1fr);

    gap:25px;

}


/* ========================= */
/* GAME CARDS */
/* ========================= */

.game-card{

    position:relative;

    min-height:220px;

    border:none;

    border-radius:25px;

    padding:30px;

    text-align:left;

    cursor:pointer;

    overflow:hidden;

    transition:
    transform .25s,
    box-shadow .25s;

}


.game-card:hover{

    transform:
    translateY(-7px)
    scale(1.02);

    box-shadow:
    0 15px 30px
    rgba(0,0,0,.2);

}


.game-card:active{

    transform:
    translateY(-2px)
    scale(.99);

}


/* ========================= */
/* CARD CONTENT */
/* ========================= */

.game-icon{

    font-size:55px;

    margin-bottom:15px;

}


.game-card h2{

    font-size:25px;

    color:white;

    margin-bottom:8px;

}


.game-card p{

    font-size:15px;

    color:rgba(255,255,255,.9);

    max-width:350px;

}


/* ========================= */
/* PLAY BUTTON */
/* ========================= */

.play{

    position:absolute;

    right:25px;

    bottom:22px;

    background:white;

    color:#003A70;

    border-radius:30px;

    padding:9px 18px;

    font-size:14px;

    font-weight:700;

}


/* ========================= */
/* CARD COLORS */
/* ========================= */

.scramble{

    background:
    linear-gradient(
        135deg,
        #7B2CBF,
        #C77DFF
    );

}


.building{

    background:
    linear-gradient(
        135deg,
        #0077B6,
        #00B4D8
    );

}


.challenge{

    background:
    linear-gradient(
        135deg,
        #E85D04,
        #F48C06
    );

}


.memory{

    background:
    linear-gradient(
        135deg,
        #2A9D8F,
        #52B788
    );

}


/* ========================= */
/* FOOTER */
/* ========================= */

.footer{

    margin-top:35px;

    display:flex;

    justify-content:space-between;

    align-items:center;

}


.footer p{

    color:#777;

    font-size:14px;

}


.back-button{

    border:none;

    background:#003A70;

    color:white;

    padding:12px 25px;

    border-radius:30px;

    font-size:15px;

    font-weight:600;

    cursor:pointer;

    transition:.2s;

}


.back-button:hover{

    background:#0057B8;

    transform:scale(1.05);

}


/* ========================= */
/* MOBILE */
/* ========================= */

@media(max-width:700px){

    body{

        padding:15px;

    }


    .arcade{

        padding:25px;

        min-height:auto;

    }


    .header{

        flex-direction:column;

        text-align:center;

        gap:15px;

    }


    .title-area h1{

        font-size:32px;

    }


    .title-area p{

        font-size:15px;

    }


    .game-grid{

        grid-template-columns:1fr;

    }


    .game-card{

        min-height:190px;

    }


    .footer{

        flex-direction:column;

        gap:15px;

    }

}

</style>

</head>


<body>


<!-- ========================= -->
<!-- MAIN MINI GAME ARCADE -->
<!-- ========================= -->

<div class="arcade">


    <!-- HEADER -->

    <div class="header">

        <div class="title-area">

            <h1>🎮 Mini Game Zone</h1>

            <p>Pick a game and see how well you can do!</p>

        </div>


        <img
            src="STFXlogo.png"
            class="logo"
            alt="StFX Logo">

    </div>



    <!-- GAME OPTIONS -->

    <div class="game-grid">


        <!-- WORD SCRAMBLE -->

        <button
            class="game-card scramble"
            onclick="startGame('scramble')">

            <div class="game-icon">
                🔤
            </div>

            <h2>Word Scramble</h2>

            <p>
                Unscramble the letters and find the hidden word!
            </p>

            <span class="play">
                Play →
            </span>

        </button>



        <!-- STFX BUILDING -->

        <button
            class="game-card building"
            onclick="startGame('building')">

            <div class="game-icon">
                🏫
            </div>

            <h2>Guess the Building</h2>

            <p>
                Can you recognize StFX's buildings and residences?
            </p>

            <span class="play">
                Play →
            </span>

        </button>



        <!-- 60 SECOND CHALLENGE -->

        <button
            class="game-card challenge"
            onclick="startGame('challenge')">

            <div class="game-icon">
                ⏱️
            </div>

            <h2>60 Second Challenge</h2>

            <p>
                Answer as many questions as you can before time runs out!
            </p>

            <span class="play">
                Play →
            </span>

        </button>



        <!-- MEMORY MATCH -->

        <button
            class="game-card memory"
            onclick="startGame('memory')">

            <div class="game-icon">
                🧠
            </div>

            <h2>Memory Match</h2>

            <p>
                Flip the cards and find all the matching pairs!
            </p>

            <span class="play">
                Play →
            </span>

        </button>


    </div>



    <!-- FOOTER -->

    <div class="footer">

        <p>
            🎉 Have fun and challenge yourself!
        </p>


        <button
            class="back-button"
            onclick="goBack()">

            ← Back

        </button>

    </div>


</div>



<script>

/* ========================= */
/* START GAME */
/* ========================= */

function startGame(game){

    if(game === "scramble"){

        alert("Word Scramble coming soon!");

    }

    else if(game === "building"){

        alert("Guess the Building coming soon!");

    }

    else if(game === "challenge"){

        alert("60 Second Challenge coming soon!");

    }

    else if(game === "memory"){

        alert("Memory Match coming soon!");

    }

}


/* ========================= */
/* BACK BUTTON */
/* ========================= */

function goBack(){

    window.location.href = "index.html";

}

</script>


</body>

</html>
