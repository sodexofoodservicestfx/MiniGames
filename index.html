<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0, user-scalable=no">

<title>STFX Mini Games</title>


<style>

/* =========================================================
   GLOBAL
========================================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, Helvetica, sans-serif;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    background:
        radial-gradient(circle at top left, #173d6b, transparent 35%),
        radial-gradient(circle at bottom right, #0b4d59, transparent 35%),
        #071525;

    color: white;
}


/* =========================================================
   SCREEN SYSTEM
========================================================= */

.screen {
    display: none;
    width: 100%;
    height: 100vh;
    min-height: 600px;
}

.screen.active {
    display: flex;
}


/* =========================================================
   WELCOME SCREEN
========================================================= */

#arcadeWelcomeScreen {
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 30px;
}

.welcome-logos {
    display: flex;
    align-items: center;
    justify-content: center;

    gap:80px;

    margin-bottom:40px;
}

.welcome-logos img {
    max-width: 220px;
    max-height: 120px;
    object-fit: contain;
}

.welcome-content h1 {
    font-size: 65px;
    font-weight:bold;
    letter-spacing: 6px;
    margin-bottom: 40px;
}

.welcome-content p {
    font-size: 40px;
    color: #b9d7ed;
    margin-bottom: 70px;
}

.start-arcade-button {
    padding: 22px 65px;

    border: none;
    border-radius: 60px;

    background: white;
    color: #123f70;

    font-size: 28px;
    font-weight: bold;

    cursor: pointer;

    box-shadow:
        0 12px 35px rgba(0,0,0,0.4);

    transition:
        transform 0.15s ease;
}

.start-arcade-button:active {
    transform: scale(0.96);
}


/* =========================================================
   MINI GAMES HOME
========================================================= */

#arcadeScreen {

    flex-direction:column;

    align-items:center;

    justify-content:flex-start;

    padding:20px;

    height:100vh;

}


/* =========================================================
   MINI GAMES TITLE
========================================================= */

.arcade-header {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 65px;
    flex-shrink: 0;
    margin-bottom: 20px;
}

.arcade-title h1 {
    font-size: 50px;
    letter-spacing: 5px;
    font-weight: bold;
    margin: 0;
}


.arcade-title p {
    margin-top: 8px;
    font-size: 22px;
    color: #b9d7ed;
}


/* =========================================================
   GAME GRID
========================================================= */

.game-grid {
    display: grid;
    grid-template-columns: 1fr;
    grid-template-rows: repeat(4, 210px);
    gap: 24px;
    width: 98%;
}



/* =========================================================
   GAME CARDS / TABS
========================================================= */

.game-card {
    width: 100%;
    height: 100%;
    border: none;
    padding: 38px;
    border-radius: 30px;
    color: white;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    text-align: left;

    display: flex;
    flex-direction: column;
    justify-content: center;

    box-shadow: 0 8px 20px rgba(0,0,0,0.35);
}

.game-card:active {
    transform: scale(0.97);
}


/* =========================================================
   GAME CARD CONTENT
========================================================= */

.game-icon{
      font-size: 58px;
    margin-bottom: 9px;
}

.game-card h2 {
    font-size: 40px;
    margin-bottom: 9px;
}

.game-card p {
    font-size: 24px;
    line-height: 1.3;
}





/* =========================================================
   CARD DECORATION
========================================================= */

.game-card::after {
    content: "";

    position: absolute;

    width: 320px;
    height: 320px;

    border-radius: 50%;

    right: -90px;
    bottom: -100px;

    background: rgba(255,255,255,0.08);

    pointer-events: none;
}


/* =========================================================
   GAME CARD COLOURS
========================================================= */

.scramble-card {
    background:
        linear-gradient(
            135deg,
            #174d8c,
            #2674c8
        );
}

.building-card {
    background:
        linear-gradient(
            135deg,
            #145c67,
            #15938c
        );
}

.challenge-card {
    background:
        linear-gradient(
            135deg,
            #793d8c,
            #b94d87
        );
}

.memory-game-tab {
    background:
        linear-gradient(
            135deg,
            #5427a3,
            #8e44c7
        );
}


/* =========================================================
   GAME SCREEN
========================================================= */

.game-screen {
    flex-direction: column;

    padding:
        25px
        45px;
}

.game-header {
    display: flex;

    justify-content: space-between;

    align-items: center;

    height: 70px;
}

.game-header h1 {
    font-size: 38px;
}

.back-button {
    background:
        rgba(255,255,255,0.12);

    color: white;

    border:
        2px solid
        rgba(255,255,255,0.25);

    padding:
        13px
        24px;

    border-radius: 30px;

    font-size: 17px;

    cursor: pointer;
}

.game-content {
    flex: 1;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    width: 100%;
}


/* =========================================================
   WORD SCRAMBLE
========================================================= */

#scrambleScreen {
    background:
        radial-gradient(
            circle at center,
            #123f70,
            #071525
        );
}

.scramble-word {
    font-size: 70px;

    font-weight:bold;

    letter-spacing: 10px;

    margin: 25px;

    text-align: center;
}

.scramble-info {
    font-size: 22px;

    margin-bottom: 20px;
}

.scramble-input {
    width: 500px;

    max-width: 90%;

    padding: 18px;

    border-radius: 15px;

    border: none;

    font-size: 28px;

    text-align: center;

    outline: none;
}

.primary-button {
    margin-top: 18px;

    padding:
        17px
        40px;

    border: none;

    border-radius: 30px;

    background: white;

    color: #123f70;

    font-size: 21px;

    font-weight: bold;

    cursor: pointer;
}

.feedback {
    height: 40px;

    margin-top: 18px;

    font-size: 22px;

    font-weight: bold;
}


/* =========================================================
   BUILDING GAME
========================================================= */

#buildingScreen {
    background:
        linear-gradient(
            rgba(5,30,40,0.85),
            rgba(5,30,40,0.95)
        );
}

.building-image {
    width: 620px;

    height: 300px;

    max-width: 85%;

    object-fit: cover;

    border-radius: 22px;

    background: #183a45;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 25px;

    color: #a9d5d7;

    margin: 15px;
}

.building-question {
    font-size: 27px;

    margin-bottom: 15px;
}

.building-options {
    display: grid;

    grid-template-columns:
        1fr
        1fr;

    gap: 14px;

    width: 650px;

    max-width: 90%;
}

.building-option {
    padding: 17px;

    border: none;

    border-radius: 14px;

    background: white;

    color: #12404a;

    font-size: 20px;

    font-weight: bold;

    cursor: pointer;
}

.building-option:active {
    transform: scale(0.97);
}


/* =========================================================
   60 SECOND CHALLENGE
========================================================= */

#challengeScreen {
    background:
        radial-gradient(
            circle at center,
            #55286b,
            #1c0d2a
        );
}

.timer {
    font-size: 100px;

    font-weight: 900;

    margin-bottom: 10px;
}

.challenge-score {
    font-size: 25px;

    margin-bottom: 30px;
}

.challenge-question {
    font-size: 35px;

    text-align: center;

    max-width: 900px;

    margin-bottom: 25px;
}

.challenge-options {
    display: grid;

    grid-template-columns:
        1fr
        1fr;

    gap: 15px;

    width: 700px;

    max-width: 90%;
}

.challenge-option {
    padding: 18px;

    border: none;

    border-radius: 15px;

    background: white;

    color: #4b2260;

    font-size: 21px;

    font-weight: bold;

    cursor: pointer;
}

.start-challenge {
    padding:
        22px
        55px;

    border: none;

    border-radius: 40px;

    font-size: 27px;

    font-weight: bold;

    background: white;

    color: #542667;

    cursor: pointer;
}


/* =========================================================
   MEMORY MATCH
========================================================= */

#memoryScreen {
    background:
        radial-gradient(
            circle at center,
            #704913,
            #211508
        );
}

.memory-info {
    font-size: 22px;

    margin-bottom: 15px;
}

.memory-board {
    display: grid;

    grid-template-columns:
        repeat(4, 110px);

    gap: 15px;
}

.memory-card {
    width: 110px;

    height: 110px;

    border: none;

    border-radius: 15px;

    cursor: pointer;

    perspective: 700px;

    background:
        transparent;
}

.memory-inner {
    width: 100%;

    height: 100%;

    position: relative;

    transition:
        transform 0.5s;

    transform-style:
        preserve-3d;
}

.memory-card.flipped .memory-inner {
    transform:
        rotateY(180deg);
}

.memory-front,
.memory-back {
    position: absolute;

    width: 100%;

    height: 100%;

    border-radius: 15px;

    backface-visibility:
        hidden;

    display: flex;

    justify-content: center;

    align-items: center;
}

.memory-front {
    background:
        #f0a928;

    font-size: 38px;

    color: white;
}

.memory-back {
    background:
        white;

    color:
        #6c4713;

    font-size: 42px;

    transform:
        rotateY(180deg);
}


/* =========================================================
   GAME OVER
========================================================= */

.game-over {
    text-align: center;
}

.game-over h2 {
    font-size: 50px;

    margin-bottom: 20px;
}

.final-score {
    font-size: 32px;

    margin-bottom: 20px;
}





/* =========================================================
   30 SECOND INACTIVITY TIMER
========================================================= */

</style>

</head>


<body>


<!-- =======================================================
     WELCOME SCREEN
======================================================= -->

<section id="arcadeWelcomeScreen"
         class="screen active">


    <div class="welcome-logos">

        <img src="STFXlogo.png"
             alt="STFX Logo">

        <img src="logo.png"
             alt="Sodexo Logo">

    </div>


    <div class="welcome-content">

        <h1>
            MINI GAMES
        </h1>

        <button class="start-arcade-button"
                onclick="openArcade()">

            START PLAYING →

        </button>

    </div>


</section>



<!-- =======================================================
     MINI GAMES HOME
======================================================= -->

<section id="arcadeScreen"
         class="screen">


    <div class="arcade-header">

        <div class="arcade-title">

            <h1>
                MINI GAMES
            </h1>

            

        </div>

    </div>



    <div class="game-grid">


        <!-- WORD SCRAMBLE -->

        <button class="game-card scramble-card"
                onclick="openGame('scrambleScreen')">

            <div class="game-icon">
                🔤
            </div>

            <h2>
                Word Scramble
            </h2>

            <p>
                Unscramble the letters and find the hidden word!
            </p>

           

        </button>



        <!-- GUESS THE BUILDING -->

        <button class="game-card building-card"
                onclick="openBuildingGame()">

            <div class="game-icon">
                🏛️
            </div>

            <h2>
                Guess the Building
            </h2>

            <p>
                Can you recognize these StFX buildings?
            </p>

           

        </button>



        <!-- 60 SECOND CHALLENGE -->

        <button class="game-card challenge-card"
                onclick="openChallengeGame()">

            <div class="game-icon">
                ⏱️
            </div>

            <h2>
                60-Second Challenge
            </h2>

            <p>
                Answer as many questions as you can before time runs out!
            </p>

            

        </button>



        <!-- MEMORY MATCH -->

        <button class="game-card memory-game-tab"
                onclick="openMemoryGame()">

            <div class="game-icon">
                🧠
            </div>

            <h2>
                Memory Match
            </h2>

            <p>
                Flip the cards and find all the matching pairs!
            </p>

           

        </button>


    </div>


</section>



<!-- =======================================================
     WORD SCRAMBLE
======================================================= -->

<section id="scrambleScreen"
         class="screen game-screen">


    <div class="game-header">

        <h1>
            🔤 Word Scramble
        </h1>

        <button class="back-button"
                onclick="goHome()">

            ← Back

        </button>

    </div>


    <div class="game-content">


        <div class="scramble-info">
            Unscramble this word:
        </div>


        <div id="scrambledWord"
             class="scramble-word">
        </div>


        <input
            id="scrambleInput"
            class="scramble-input"
            type="text"
            placeholder="Type your answer"
            autocomplete="off">


        <button class="primary-button"
                onclick="checkScramble()">

            CHECK ANSWER

        </button>


        <div id="scrambleFeedback"
             class="feedback">
        </div>


        <button class="primary-button"
                onclick="newScramble()">

            NEXT WORD

        </button>


    </div>


</section>



<!-- =======================================================
     GUESS THE BUILDING
======================================================= -->

<section id="buildingScreen"
         class="screen game-screen">


    <div class="game-header">

        <h1>
            🏛️ Guess the Building
        </h1>

        <button class="back-button"
                onclick="goHome()">

            ← Back

        </button>

    </div>


    <div class="game-content">


        <div class="building-question">

            Which StFX building is this?

        </div>


        <div id="buildingImage"
             class="building-image">

            Building Photo

        </div>


        <div id="buildingOptions"
             class="building-options">
        </div>


        <div id="buildingFeedback"
             class="feedback">
        </div>


    </div>


</section>



<!-- =======================================================
     60 SECOND CHALLENGE
======================================================= -->

<section id="challengeScreen"
         class="screen game-screen">


    <div class="game-header">

        <h1>
            ⏱️ 60-Second Challenge
        </h1>

        <button class="back-button"
                onclick="goHome()">

            ← Back

        </button>

    </div>


    <div class="game-content">


        <div id="challengeStart">

            <h2 style="
                font-size:40px;
                margin-bottom:20px;
            ">

                Ready?

            </h2>


            <p style="
                font-size:22px;
                margin-bottom:30px;
            ">

                Answer as many questions as possible in 60 seconds!

            </p>


            <button class="start-challenge"
                    onclick="startChallenge()">

                START!

            </button>

        </div>



        <div id="challengeGame"
             style="
                display:none;
                width:100%;
             ">


            <div class="timer"
                 id="timer">

                60

            </div>


            <div class="challenge-score">

                Score:

                <span id="challengeScore">
                    0
                </span>

            </div>


            <div id="challengeQuestion"
                 class="challenge-question">
            </div>


            <div id="challengeOptions"
                 class="challenge-options">
            </div>


        </div>



        <div id="challengeOver"
             class="game-over"
             style="
                display:none;
             ">


            <h2>
                TIME'S UP!
            </h2>


            <div class="final-score">

                Your Score:

                <span id="finalChallengeScore">
                    0
                </span>

            </div>


            <button class="start-challenge"
                    onclick="startChallenge()">

                PLAY AGAIN

            </button>


        </div>


    </div>


</section>



<!-- =======================================================
     MEMORY MATCH
======================================================= -->

<section id="memoryScreen"
         class="screen game-screen">


    <div class="game-header">

        <h1>
            🧠 Memory Match
        </h1>


        <button class="back-button"
                onclick="goHome()">

            ← Back

        </button>


    </div>


    <div class="game-content">


        <div class="memory-info">

            Matches:

            <span id="matches">
                0
            </span>

            / 8

        </div>


        <div id="memoryBoard"
             class="memory-board">
        </div>


        <div id="memoryFeedback"
             class="feedback">
        </div>


        <button class="primary-button"
                onclick="openMemoryGame()">

            NEW GAME

        </button>


    </div>


</section>



<script>


/* =========================================================
   GENERAL NAVIGATION
========================================================= */

let inactivityTimer;


/* =========================================================
   30 SECOND INACTIVITY TIMER
========================================================= */

function resetInactivityTimer() {

    clearTimeout(
        inactivityTimer
    );

    inactivityTimer =
        setTimeout(
            () => {

                goToWelcome();

            },
            30000
        );

}


/* =========================================================
   RETURN TO WELCOME SCREEN
========================================================= */

function goToWelcome() {

    clearInterval(
        challengeInterval
    );

    document.querySelectorAll(".screen")
        .forEach(
            screen => {

                screen.classList.remove(
                    "active"
                );

            }
        );

    document.getElementById(
        "arcadeWelcomeScreen"
    ).classList.add(
        "active"
    );

    resetInactivityTimer();

}


/* =========================================================
   OPEN MINI GAMES MENU
========================================================= */

function openArcade() {

    document.querySelectorAll(".screen")
        .forEach(
            screen => {

                screen.classList.remove(
                    "active"
                );

            }
        );

    document.getElementById(
        "arcadeScreen"
    ).classList.add(
        "active"
    );

    resetInactivityTimer();

}


/* =========================================================
   OPEN GAME
========================================================= */

function openGame(id) {

    document.querySelectorAll(".screen")
        .forEach(
            screen => {

                screen.classList.remove(
                    "active"
                );

            }
        );

    document.getElementById(
        id
    ).classList.add(
        "active"
    );

    resetInactivityTimer();

}


/* =========================================================
   RETURN TO MINI GAMES MENU
========================================================= */

function goHome() {

    document.querySelectorAll(".screen")
        .forEach(
            screen => {

                screen.classList.remove(
                    "active"
                );

            }
        );

    document.getElementById(
        "arcadeScreen"
    ).classList.add(
        "active"
    );

    clearInterval(
        challengeInterval
    );

    resetInactivityTimer();

}


/* =========================================================
   RESET TIMER WHEN USER INTERACTS
========================================================= */

document.addEventListener(
    "click",
    resetInactivityTimer
);

document.addEventListener(
    "touchstart",
    resetInactivityTimer
);

document.addEventListener(
    "mousemove",
    resetInactivityTimer
);



/* =========================================================
   WORD SCRAMBLE
========================================================= */

const scrambleWords = [

    "STFX",
    "CAMPUS",
    "MORRISON",
    "MEALHALL",
    "ANTIGONISH",
    "STUDENT",
    "UNIVERSITY",
    "TRADITION",
    "XAVERIAN",
    "SCHOLAR",
    "COMMUNITY",
    "DINING"

];


let currentScramble = "";


function shuffleWord(word) {

    let letters =
        word.split("");


    for (
        let i =
            letters.length - 1;

        i > 0;

        i--
    ) {

        let j =
            Math.floor(
                Math.random() *
                (i + 1)
            );


        [
            letters[i],
            letters[j]
        ] = [

            letters[j],
            letters[i]

        ];

    }


    return letters.join("");

}


function newScramble() {

    currentScramble =
        scrambleWords[
            Math.floor(
                Math.random() *
                scrambleWords.length
            )
        ];


    let scrambled =
        shuffleWord(
            currentScramble
        );


    document.getElementById(
        "scrambledWord"
    ).textContent =
        scrambled;


    document.getElementById(
        "scrambleInput"
    ).value =
        "";


    document.getElementById(
        "scrambleFeedback"
    ).textContent =
        "";

}


function checkScramble() {

    let answer =
        document.getElementById(
            "scrambleInput"
        ).value
        .trim()
        .toUpperCase();


    let feedback =
        document.getElementById(
            "scrambleFeedback"
        );


    if (
        answer ===
        currentScramble
    ) {

        feedback.textContent =
            "✓ Correct! Great job!";


        feedback.style.color =
            "#76e6a2";

    }

    else {

        feedback.textContent =
            "✗ Not quite. Try again!";


        feedback.style.color =
            "#ff9b9b";

    }

}


newScramble();



/* =========================================================
   GUESS THE BUILDING
========================================================= */

const buildings = [

    {
        name:
            "Morrison Hall",

        image:
            "images/morrison.jpg"
    },


    {
        name:
            "Bloomfield Centre",

        image:
            "images/bloomfield.jpg"
    },


    {
        name:
            "Keating Centre",

        image:
            "images/keating.jpg"
    },


    {
        name:
            "McKenna Centre",

        image:
            "images/mckenna.jpg"
    }

];


let currentBuilding;


function openBuildingGame() {

    openGame(
        "buildingScreen"
    );

    loadBuilding();

}


function loadBuilding() {

    currentBuilding =
        buildings[
            Math.floor(
                Math.random() *
                buildings.length
            )
        ];


    let image =
        document.getElementById(
            "buildingImage"
        );


    image.innerHTML = `

        <img
            src="${currentBuilding.image}"

            style="
                width:100%;
                height:100%;
                object-fit:cover;
                border-radius:22px;
            "

            onerror="
                this.style.display='none';

                this.parentElement.innerHTML =
                'Building Photo';
            "
        >

    `;


    let options =
        [...buildings]
        .sort(
            () =>
                Math.random() -
                0.5
        )
        .slice(
            0,
            4
        );


    if (
        !options.some(
            building =>
                building.name ===
                currentBuilding.name
        )
    ) {

        options[0] =
            currentBuilding;

    }


    options =
        options.sort(
            () =>
                Math.random() -
                0.5
        );


    let container =
        document.getElementById(
            "buildingOptions"
        );


    container.innerHTML =
        "";


    options.forEach(
        building => {

            let button =
                document.createElement(
                    "button"
                );


            button.className =
                "building-option";


            button.textContent =
                building.name;


            button.onclick =
                () =>
                    checkBuilding(
                        building.name
                    );


            container.appendChild(
                button
            );

        }
    );


    document.getElementById(
        "buildingFeedback"
    ).textContent =
        "";

}


function checkBuilding(answer) {

    let feedback =
        document.getElementById(
            "buildingFeedback"
        );


    if (
        answer ===
        currentBuilding.name
    ) {

        feedback.textContent =
            "✓ Correct!";


        feedback.style.color =
            "#76e6a2";


        setTimeout(
            loadBuilding,
            1200
        );

    }

    else {

        feedback.textContent =
            "✗ Try again!";


        feedback.style.color =
            "#ff9b9b";

    }

}

/* =========================================================
   MEMORY MATCH
========================================================= */

const memorySymbols = [

    "🏛️",
    "⭐",
    "📚",
    "🎓",
    "🍎",
    "🏐",
    "☕",
    "🌊"

];


let memoryCards = [];

let firstCard =
    null;

let secondCard =
    null;

let lockBoard =
    false;

let memoryMatches =
    0;



function openMemoryGame() {

    openGame(
        "memoryScreen"
    );

    createMemoryBoard();

}



function createMemoryBoard() {

    memoryMatches =
        0;


    firstCard =
        null;


    secondCard =
        null;


    lockBoard =
        false;


    document.getElementById(
        "matches"
    ).textContent =
        0;


    document.getElementById(
        "memoryFeedback"
    ).textContent =
        "";


    let cards =
        [

            ...memorySymbols,

            ...memorySymbols

        ];


    cards =
        cards.sort(
            () =>
                Math.random() -
                0.5
        );


    let board =
        document.getElementById(
            "memoryBoard"
        );


    board.innerHTML =
        "";


    cards.forEach(
        symbol => {

            let card =
                document.createElement(
                    "button"
                );


            card.className =
                "memory-card";


            card.innerHTML = `

                <div class="memory-inner">

                    <div class="memory-front">
                        ?
                    </div>

                    <div class="memory-back">
                        ${symbol}
                    </div>

                </div>

            `;


            card.onclick =
                () =>
                    flipCard(
                        card,
                        symbol
                    );


            board.appendChild(
                card
            );

        }
    );

}



function flipCard(card, symbol) {

    if (

        lockBoard ||

        card === firstCard ||

        card.classList.contains(
            "matched"
        )

    ) {

        return;

    }


    card.classList.add(
        "flipped"
    );


    if (
        !firstCard
    ) {

        firstCard =
            card;


        card.dataset.symbol =
            symbol;


        return;

    }


    secondCard =
        card;


    card.dataset.symbol =
        symbol;


    checkMemoryMatch();

}



function checkMemoryMatch() {

    if (

        firstCard.dataset.symbol ===

        secondCard.dataset.symbol

    ) {

        firstCard.classList.add(
            "matched"
        );


        secondCard.classList.add(
            "matched"
        );


        memoryMatches++;


        document.getElementById(
            "matches"
        ).textContent =
            memoryMatches;


        resetMemoryTurn();


        if (
            memoryMatches ===
            8
        ) {

            document.getElementById(
                "memoryFeedback"
            ).textContent =
                "🎉 You found them all!";

        }

    }

    else {

        lockBoard =
            true;


        setTimeout(
            () => {

                firstCard.classList.remove(
                    "flipped"
                );


                secondCard.classList.remove(
                    "flipped"
                );


                resetMemoryTurn();

            },
            900
        );

    }

}



function resetMemoryTurn() {

    firstCard =
        null;


    secondCard =
        null;


    lockBoard =
        false;

}
