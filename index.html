<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>STFX Mini Game Zone</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

/* ========================= */
/* GENERAL */
/* ========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}


/* ========================= */
/* BODY */
/* ========================= */

body{

    width:100%;
    height:100vh;

    overflow:hidden;

    background:
    linear-gradient(
        135deg,
        #003A70,
        #0057B8,
        #0077C8
    );

    color:white;

    position:relative;

}


/* ========================= */
/* BACKGROUND SHAPES */
/* ========================= */

body::before{

    content:"";

    position:absolute;

    width:500px;
    height:500px;

    border-radius:50%;

    background:rgba(255,255,255,.06);

    top:-200px;
    left:-150px;

}


body::after{

    content:"";

    position:absolute;

    width:600px;
    height:600px;

    border-radius:50%;

    background:rgba(255,255,255,.05);

    bottom:-350px;
    right:-200px;

}


/* ========================= */
/* MAIN PAGE */
/* ========================= */

.game-page{

    position:relative;

    z-index:1;

    width:100%;
    height:100%;

    padding:35px 60px;

    display:flex;

    flex-direction:column;

}


/* ========================= */
/* TOP BAR */
/* ========================= */

.top-bar{

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:25px;

}


.logo-area{

    display:flex;

    align-items:center;

    gap:20px;

}


.logo-area img{

    height:60px;

    width:auto;

    object-fit:contain;

}


.sodexo-logo{

    height:50px !important;

}


.home-button{

    border:none;

    background:rgba(255,255,255,.15);

    color:white;

    padding:12px 22px;

    border-radius:30px;

    font-size:16px;

    font-weight:600;

    cursor:pointer;

    transition:.25s;

}


.home-button:hover{

    background:rgba(255,255,255,.25);

    transform:scale(1.05);

}


/* ========================= */
/* TITLE */
/* ========================= */

.title-section{

    text-align:center;

    margin-bottom:35px;

}


.title-section h1{

    font-size:52px;

    font-weight:800;

    letter-spacing:1px;

    text-shadow:0 4px 10px rgba(0,0,0,.2);

}


.title-section p{

    font-size:20px;

    margin-top:5px;

    opacity:.9;

}


/* ========================= */
/* GAME GRID */
/* ========================= */

.game-grid{

    flex:1;

    display:grid;

    grid-template-columns:repeat(2,1fr);

    gap:22px;

    max-width:1100px;

    width:100%;

    margin:0 auto;

}


/* ========================= */
/* GAME CARDS */
/* ========================= */

.game-card{

    border:none;

    border-radius:25px;

    padding:25px;

    display:flex;

    align-items:center;

    gap:25px;

    text-align:left;

    cursor:pointer;

    color:#003A70;

    box-shadow:0 10px 25px rgba(0,0,0,.18);

    transition:.25s;

    min-height:150px;

}


.game-card:hover{

    transform:translateY(-6px) scale(1.02);

    box-shadow:0 18px 35px rgba(0,0,0,.25);

}


/* ========================= */
/* GAME ICON */
/* ========================= */

.game-icon{

    width:90px;

    height:90px;

    border-radius:22px;

    background:rgba(255,255,255,.65);

    display:flex;

    justify-content:center;

    align-items:center;

    font-size:48px;

    flex-shrink:0;

}


/* ========================= */
/* GAME TEXT */
/* ========================= */

.game-info h2{

    font-size:25px;

    margin-bottom:5px;

}


.game-info p{

    font-size:15px;

    color:#555;

}


/* ========================= */
/* INDIVIDUAL GAME COLOURS */
/* ========================= */

.scramble{

    background:#FFD166;

}


.guess{

    background:#06D6A0;

}


.challenge{

    background:#EF476F;

    color:white;

}


.memory{

    background:#9B5DE5;

    color:white;

}


.challenge .game-info p,
.memory .game-info p{

    color:rgba(255,255,255,.85);

}


/* ========================= */
/* FOOTER */
/* ========================= */

.footer{

    text-align:center;

    margin-top:25px;

    font-size:16px;

    opacity:.85;

}


/* ========================= */
/* MOBILE */
/* ========================= */

@media(max-width:700px){

    .game-page{

        padding:20px;

    }


    .title-section h1{

        font-size:35px;

    }


    .title-section p{

        font-size:16px;

    }


    .game-grid{

        grid-template-columns:1fr;

        gap:12px;

    }


    .game-card{

        min-height:110px;

        padding:18px;

    }


    .game-icon{

        width:65px;

        height:65px;

        font-size:35px;

    }


    .game-info h2{

        font-size:20px;

    }


    .game-info p{

        font-size:13px;

    }

}

</style>

</head>


<body>


<div class="game-page">


<!-- ========================= -->
<!-- TOP BAR -->
<!-- ========================= -->

<div class="top-bar">


    <div class="logo-area">

        <img src="STFXlogo.png" alt="StFX Logo">

        <img src="logo.png"
             alt="Sodexo Logo"
             class="sodexo-logo">

    </div>


    <button class="home-button"
            onclick="goHome()">

        🏠 Home

    </button>


</div>



<!-- ========================= -->
<!-- TITLE -->
<!-- ========================= -->

<div class="title-section">

    <h1>🎮 MINI GAME ZONE</h1>

    <p>Pick a game and test your skills!</p>

</div>



<!-- ========================= -->
<!-- GAME GRID -->
<!-- ========================= -->

<div class="game-grid">


    <!-- WORD SCRAMBLE -->

    <button class="game-card scramble"
            onclick="startGame('scramble')">

        <div class="game-icon">

            🔤

        </div>

        <div class="game-info">

            <h2>Word Scramble</h2>

            <p>Unscramble the letters before time runs out!</p>

        </div>

    </button>



    <!-- GUESS THE PLACE -->

    <button class="game-card guess"
            onclick="startGame('guess')">

        <div class="game-icon">

            🏛️

        </div>

        <div class="game-info">

            <h2>Guess the StFX Spot</h2>

            <p>Can you identify the StFX building or residence?</p>

        </div>

    </button>



    <!-- 60 SECOND CHALLENGE -->

    <button class="game-card challenge"
            onclick="startGame('challenge')">

        <div class="game-icon">

            ⏱️

        </div>

        <div class="game-info">

            <h2>60-Second Challenge</h2>

            <p>How many questions can you answer in 60 seconds?</p>

        </div>

    </button>



    <!-- MEMORY MATCH -->

    <button class="game-card memory"
            onclick="startGame('memory')">

        <div class="game-icon">

            🧠

        </div>

        <div class="game-info">

            <h2>Memory Match</h2>

            <p>Match the cards and test your memory!</p>

        </div>

    </button>


</div>



<!-- ========================= -->
<!-- FOOTER -->
<!-- ========================= -->

<div class="footer">

    Tap a game to start playing!

</div>


</div>



<script>


/* ========================= */
/* START GAME */
/* ========================= */

function startGame(game){

    if(game === "scramble"){

        alert("Word Scramble coming soon!");

    }


    if(game === "guess"){

        alert("Guess the StFX Spot coming soon!");

    }


    if(game === "challenge"){

        alert("60-Second Challenge coming soon!");

    }


    if(game === "memory"){

        alert("Memory Match coming soon!");

    }

}


/* ========================= */
/* HOME BUTTON */
/* ========================= */

function goHome(){

    window.location.href = "index.html";

}


</script>


</body>

</html>
