```html
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>STFX Mini Games</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

/* ========================= */
/* GENERAL */
/* ========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}


/* ========================= */
/* BODY */
/* ========================= */

body{

    width:100%;
    height:100vh;

    background:
    linear-gradient(
        rgba(0,40,90,.75),
        rgba(0,27,68,.85)
    ),
    url("stfxcampus.jpg");

    background-size:cover;
    background-position:center;

    display:flex;
    justify-content:center;
    align-items:center;

    overflow:hidden;

}


/* ========================= */
/* MAIN CONTAINER */
/* ========================= */

.container{

    width:90%;
    max-width:900px;

    background:white;

    border-radius:30px;

    padding:45px 50px;

    box-shadow:
        0 25px 60px rgba(0,0,0,.25);

    text-align:center;

}


/* ========================= */
/* LOGOS */
/* ========================= */

.logos{

    display:flex;

    justify-content:center;
    align-items:center;

    gap:35px;

    margin-bottom:25px;

}


.logos img{

    height:80px;

    width:auto;

    max-width:300px;

    object-fit:contain;

}


.sodexo-logo{

    height:70px !important;

}


/* ========================= */
/* TITLE */
/* ========================= */

h1{

    color:#003A70;

    font-size:42px;

    margin-bottom:10px;

}


.subtitle{

    color:#666;

    font-size:20px;

    margin-bottom:35px;

}


/* ========================= */
/* GAME GRID */
/* ========================= */

.game-grid{

    display:grid;

    grid-template-columns:repeat(2,1fr);

    gap:18px;

}


/* ========================= */
/* GAME BUTTONS */
/* ========================= */

.game-button{

    border:none;

    background:#F4F6F8;

    border:3px solid transparent;

    border-radius:20px;

    padding:25px 15px;

    color:#003A70;

    cursor:pointer;

    transition:.25s;

}


.game-button:hover{

    background:#EEF5FF;

    border-color:#0057B8;

    transform:translateY(-5px);

    box-shadow:
        0 8px 20px rgba(0,0,0,.12);

}


.game-icon{

    font-size:42px;

    display:block;

    margin-bottom:8px;

}


.game-title{

    font-size:21px;

    font-weight:600;

}


.game-description{

    display:block;

    color:#666;

    font-size:14px;

    margin-top:5px;

}


/* ========================= */
/* MESSAGE */
/* ========================= */

#message{

    display:none;

    margin-top:30px;

    padding:15px;

    border-radius:15px;

    background:#EEF5FF;

    color:#003A70;

    font-size:18px;

    font-weight:600;

}


/* ========================= */
/* MOBILE */
/* ========================= */

@media(max-width:600px){

    .container{

        width:94%;

        padding:30px 20px;

    }


    .logos{

        gap:20px;

    }


    .logos img{

        height:55px;

    }


    .sodexo-logo{

        height:48px !important;

    }


    h1{

        font-size:30px;

    }


    .subtitle{

        font-size:16px;

        margin-bottom:25px;

    }


    .game-grid{

        gap:10px;

    }


    .game-button{

        padding:18px 8px;

    }


    .game-icon{

        font-size:32px;

    }


    .game-title{

        font-size:16px;

    }


    .game-description{

        font-size:11px;

    }

}

</style>

</head>


<body>


<div class="container">


    <!-- ========================= -->
    <!-- LOGOS -->
    <!-- ========================= -->

    <div class="logos">

        <img
            src="STFXlogo.png"
            alt="StFX Logo">

        <img
            src="logo.png"
            alt="Sodexo Logo"
            class="sodexo-logo">

    </div>


    <!-- ========================= -->
    <!-- TITLE -->
    <!-- ========================= -->

    <h1>

        🎮 STFX Mini Games

    </h1>


    <p class="subtitle">

        Pick a game and see how high you can score!

    </p>


    <!-- ========================= -->
    <!-- GAME BUTTONS -->
    <!-- ========================= -->

    <div class="game-grid">


        <button
            class="game-button"
            onclick="openGame('scramble')">

            <span class="game-icon">

                🔤

            </span>

            <span class="game-title">

                Word Scramble

            </span>

            <span class="game-description">

                Unscramble the word!

            </span>

        </button>


        <button
            class="game-button"
            onclick="openGame('building')">

            <span class="game-icon">

                🏫

            </span>

            <span class="game-title">

                Guess the Building

            </span>

            <span class="game-description">

                Can you recognize StFX?

            </span>

        </button>


        <button
            class="game-button"
            onclick="openGame('challenge')">

            <span class="game-icon">

                ⚡

            </span>

            <span class="game-title">

                60-Second Challenge

            </span>

            <span class="game-description">

                How many can you answer?

            </span>

        </button>


        <button
            class="game-button"
            onclick="openGame('memory')">

            <span class="game-icon">

                🧠

            </span>

            <span class="game-title">

                Memory Match

            </span>

            <span class="game-description">

                Find all the matching pairs!

            </span>

        </button>


    </div>


    <!-- ========================= -->
    <!-- TEMPORARY MESSAGE -->
    <!-- ========================= -->

    <div id="message"></div>


</div>


<script>


/* ========================= */
/* OPEN GAME */
/* ========================= */

function openGame(game){

    const message =
        document.getElementById("message");


    if(game === "scramble"){

        message.textContent =
            "🔤 Word Scramble coming soon!";

    }


    else if(game === "building"){

        message.textContent =
            "🏫 Guess the Building coming soon!";

    }


    else if(game === "challenge"){

        message.textContent =
            "⚡ 60-Second Challenge coming soon!";

    }


    else if(game === "memory"){

        message.textContent =
            "🧠 Memory Match coming soon!";

    }


    message.style.display = "block";

}

</script>


</body>

</html>
```
